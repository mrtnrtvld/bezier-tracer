<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bézier tracer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e6e9ec; --panel:#fbfbfa; --ink:#23272c; --muted:#6a727b; --line:#d2d7dc;
  --accent:#2f6fd6; --handle:#d6336c; --board:#ffffff; --btn:#eef0f2; --btn-on:#23272c; --btn-on-ink:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#191c20; --panel:#23272c; --ink:#e7e9eb; --muted:#9aa2ab; --line:#373d44;
    --accent:#6ea3ff; --handle:#ff6f9c; --board:#2b3036; --btn:#2e333a; --btn-on:#e7e9eb; --btn-on-ink:#191c20;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191c20; --panel:#23272c; --ink:#e7e9eb; --muted:#9aa2ab; --line:#373d44;
  --accent:#6ea3ff; --handle:#ff6f9c; --board:#2b3036; --btn:#2e333a; --btn-on:#e7e9eb; --btn-on-ink:#191c20;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.group{display:flex;gap:6px;align-items:center}
button,.filebtn{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;line-height:1.3}
button:hover,.filebtn:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
button:focus-visible,.filebtn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);border-color:var(--btn-on)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn{position:relative}
label.ctl{display:flex;gap:6px;align-items:center;color:var(--muted)}
input[type=range]{width:90px;accent-color:var(--accent)}
input[type=number]{width:56px;font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input.dim{width:68px}
input[type=color]{width:32px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.spacer{flex:1}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
body[data-tool="pen"] #svg,body[data-tool="circle"] #svg,body[data-tool="rect"] #svg{cursor:crosshair}
body[data-tool="pan"] #svg,body.panning #svg{cursor:grab}
.board{fill:var(--board)}
.trace{stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.hit{stroke:transparent;pointer-events:none}
body[data-tool="edit"] .hit{pointer-events:stroke;cursor:move}
body[data-tool="edit"] .hit.filled{pointer-events:visiblePainted}
input[type=checkbox]{margin:0;accent-color:var(--accent)}
body[data-tool="text"] #svg{cursor:text}
select{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:160px}
.label{pointer-events:none;user-select:none;-webkit-user-select:none}
body[data-tool="edit"] .label{pointer-events:auto;cursor:move}
body[data-tool="text"] .label{pointer-events:auto;cursor:text}
.texted{position:absolute;transform:translate(-50%,-50%);font-family:Figtree,system-ui,sans-serif;line-height:1.1;
  text-align:center;background:color-mix(in srgb,var(--panel) 70%,transparent);border:1px dashed var(--accent);border-radius:3px;
  padding:0 4px;margin:0;outline:none;field-sizing:content;min-width:3ch}
.preview{fill:none;stroke:var(--accent);stroke-dasharray:4 4;opacity:.7;pointer-events:none;vector-effect:non-scaling-stroke}
.hline{stroke:var(--handle);pointer-events:none}
.hdot{fill:var(--panel);stroke:var(--handle);pointer-events:none}
.anchor{fill:var(--panel);stroke:var(--accent);pointer-events:none}
.anchor.on{fill:var(--accent)}
.anchor.closing{fill:var(--handle);stroke:var(--handle)}
.anchor-dim{fill:var(--accent);opacity:.55;pointer-events:none}
.insert{fill:var(--panel);stroke:var(--accent);pointer-events:none}
.selline{fill:none;stroke:var(--accent);opacity:.6;pointer-events:none}
.bbox{fill:none;stroke:var(--accent);pointer-events:none}
.bcorner{fill:var(--panel);stroke:var(--accent);pointer-events:none}
.layers{position:absolute;top:8px;right:8px;bottom:8px;width:236px;max-width:calc(100% - 16px);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.14);overflow:hidden;z-index:2}
.layers[hidden]{display:none}
.layers-head{padding:8px 10px;font-weight:600;border-bottom:1px solid var(--line)}
.layer-list{list-style:none;margin:0;padding:4px;overflow:auto;flex:1}
.layer{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 2px;border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none}
.layer:hover{background:var(--btn)}
.layer.on{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.layer.off .sw,.layer.off .lname{opacity:.4}
.layer.drop-above{box-shadow:inset 0 2px 0 var(--accent)}
.layer.drop-below{box-shadow:inset 0 -2px 0 var(--accent)}
.layer .eye{border:none;background:none;padding:3px;display:grid;place-items:center;color:var(--muted)}
.layer .eye svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sw{width:16px;height:16px;border-radius:3px;flex:none;display:grid;place-items:center;font-weight:600;font-size:12px;line-height:1;box-sizing:border-box}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layers-none{color:var(--muted);padding:10px;font-size:13px}
.layers-foot{display:flex;gap:4px;padding:6px;border-top:1px solid var(--line)}
.layers-foot button{flex:1;padding:4px 0}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--muted);text-align:center;padding:24px}
.empty p{margin:0;max-width:34ch;font-size:15px}
.stage.dragover::after{content:"";position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:10px;pointer-events:none}
.hint{padding:6px 12px;font-size:13px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--btn);color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:16px;width:min(680px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 10px;font-size:16px;font-weight:600}
dialog textarea{width:100%;height:280px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
@media (max-width:640px){.hint{display:none}input[type=range]{width:70px}}
</style>
</head>
<body data-tool="pen">

<div class="bar">
  <div class="group" role="group" aria-label="Tools">
    <button id="t-pen" aria-pressed="true" title="Pen (P)">Pen</button>
    <button id="t-rect" aria-pressed="false" title="Rectangle (R)">Rectangle</button>
    <button id="t-circle" aria-pressed="false" title="Circle (C)">Circle</button>
    <button id="t-text" aria-pressed="false" title="Text (T)">Text</button>
    <button id="t-edit" aria-pressed="false" title="Edit (V)">Edit</button>
    <button id="t-pan" aria-pressed="false" title="Pan (H, or hold Space)">Pan</button>
  </div>
  <div class="group">
    <label class="filebtn" title="Bring in the shapes and text from an SVG file as editable paths">Import SVG<input type="file" id="svgfile" accept=".svg,image/svg+xml"></label>
    <label class="filebtn">Load sketch<input type="file" id="file" accept="image/*"></label>
    <label class="ctl">Sketch <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.5" aria-label="Sketch opacity"></label>
    <button id="flip-h" aria-pressed="false" title="Flip sketch and drawing horizontally">Flip ↔</button>
    <button id="flip-v" aria-pressed="false" title="Flip sketch and drawing vertically">Flip ↕</button>
    <button id="clear-sketch" title="Remove the sketch image (your paths stay)" disabled>Remove sketch</button>
  </div>
  <div class="group">
    <label class="ctl">Stroke <input type="color" id="color" value="#2f6fd6" aria-label="Stroke color"></label>
    <input type="number" id="width" min="0" max="40" step="0.5" value="3" aria-label="Stroke width" title="Stroke width (0 for no outline)">
  </div>
  <div class="group" title="Fill for the selected paths and for new paths">
    <label class="ctl">Fill <input type="checkbox" id="fill-on" aria-label="Fill on"></label>
    <input type="color" id="fill" value="#f2c94c" aria-label="Fill color">
  </div>
  <div class="group" title="Font and size of the selected text and of new text">
    <select id="tfont" aria-label="Font"><option value="Figtree">Figtree</option></select>
    <label class="ctl">Size <input type="number" id="tsize" min="4" max="400" step="1" value="32" aria-label="Text size"></label>
  </div>
  <div class="group" title="Canvas size in pixels. Your drawing stays anchored to the top-left corner.">
    <label class="ctl">Canvas <input type="number" id="docw" class="dim" min="1" max="20000" step="1" aria-label="Canvas width"></label>
    <span aria-hidden="true" style="color:var(--muted)">×</span>
    <input type="number" id="doch" class="dim" min="1" max="20000" step="1" aria-label="Canvas height">
  </div>
  <div class="group">
    <button id="zoomout" title="Zoom out">−</button>
    <button id="fit" title="Fit to window (0)">Fit</button>
    <button id="zoomin" title="Zoom in">+</button>
  </div>
  <div class="spacer"></div>
  <div class="group">
    <button id="layers-btn" aria-pressed="false" aria-controls="layers" title="Show the layers panel (L)">Layers</button>
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button id="del" title="Delete selected (Delete)">Delete</button>
    <button id="clear" title="Remove all paths">Clear</button>
    <button id="export" class="primary">Export SVG</button>
  </div>
</div>

<div class="stage" id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <g id="world">
      <rect class="board" id="board" x="0" y="0" width="1000" height="750"/>
      <image id="img" x="0" y="0" opacity="0.5" preserveAspectRatio="none"/>
      <g id="paths"></g>
      <g id="overlay"></g>
    </g>
  </svg>
  <input id="texted" class="texted" type="text" aria-label="Text" spellcheck="false" autocomplete="off" hidden>
  <aside class="layers" id="layers" aria-label="Layers" hidden>
    <div class="layers-head">Layers</div>
    <ol class="layer-list" id="layer-list"></ol>
    <div class="layers-foot">
      <button id="z-front" title="Bring to front (Shift+])" aria-label="Bring to front">⤒</button>
      <button id="z-up" title="Bring forward (])" aria-label="Bring forward">↑</button>
      <button id="z-down" title="Send backward ([)" aria-label="Send backward">↓</button>
      <button id="z-back" title="Send to back (Shift+[)" aria-label="Send to back">⤓</button>
    </div>
  </aside>
  <div class="empty" id="empty"><p>Drop a sketch image here, or use Load sketch. You can also start drawing on the blank board.</p></div>
</div>

<div class="hint" id="hint"></div>

<dialog id="dlg">
  <h2>Your traced SVG</h2>
  <textarea id="out" readonly spellcheck="false"></textarea>
  <div class="dlg-actions">
    <button id="download" class="primary">Download .svg</button>
    <button id="copy">Copy SVG</button>
    <button id="close">Close</button>
  </div>
</dialog>

<script>
(() => {
const $ = id => document.getElementById(id);
const svg = $('svg'), world = $('world'), board = $('board'), img = $('img');
const pathsG = $('paths'), overlayG = $('overlay'), stage = $('stage');

let doc = { w: 1000, h: 750 };
let paths = [];            // [{closed, fill, nodes:[{x,y,hi,ho,corner}]}]  fill: color string or null
let cur = null;            // index of path being drawn with the pen
let sel = { p: -1, n: -1 };
let tool = 'pen';
let view = { x: 0, y: 0, k: 1 };
let texts = [];            // [{x, y, text, size, color, font}]  x,y is the text's center
let selT = -1;             // index of the selected text, or -1
let editT = null;          // text being typed: {i (-1 for new), x, y, size, color}
let style = { color: '#2f6fd6', width: 3, fill: '#f2c94c', fillOn: false, textSize: 32, font: 'Figtree' };
let hover = null, drag = null, spaceDown = false, hasImage = false;
let lastTap = { t: 0, x: 0, y: 0 };
let extra = []; // additional selected paths (Shift-click)
let undoStack = [], redoStack = [];

const f = v => Math.round(v * 100) / 100;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const state = () => JSON.stringify({ paths, texts, cur, flip, doc });
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function pushUndo(s) { undoStack.push(s); if (undoStack.length > 200) undoStack.shift(); redoStack = []; }
function snap() { pushUndo(state()); }
function restore(s) {
  const o = JSON.parse(s); paths = o.paths; texts = o.texts || []; cur = o.cur; selT = -1; normZ();
  if (o.flip) { flip = o.flip; applyFlip(); }
  if (o.doc && (o.doc.w !== doc.w || o.doc.h !== doc.h)) { setDoc(o.doc.w, o.doc.h); fit(); }
  extra = [];
  if (cur !== null && (!paths[cur] || paths[cur].closed)) cur = null;
  sel = { p: cur ?? -1, n: -1 }; render(); save();
}
function undo() { if (!undoStack.length) return; redoStack.push(state()); restore(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(state()); restore(redoStack.pop()); }

function save() {
  try { localStorage.setItem('bezier-tracer-v1', JSON.stringify({ paths, texts, doc, style })); } catch (e) {}
}
function load() {
  try {
    const o = JSON.parse(localStorage.getItem('bezier-tracer-v1') || 'null');
    if (o) { paths = o.paths || []; texts = o.texts || []; doc = o.doc || doc; style = { ...style, ...o.style }; }
  } catch (e) {}
  normZ();
  $('color').value = style.color; $('width').value = style.width;
}

/* ---------- stacking order ---------- */
// Paths and texts share one stacking order through their `z` value (higher = in front).
function normZ() {
  let m = Math.max(-1, ...paths.map(p => p.z ?? -1), ...texts.map(t => t.z ?? -1));
  paths.forEach(p => { if (p.z == null) p.z = ++m; });
  texts.forEach(t => { if (t.z == null) t.z = ++m; });
}
const nextZ = () => Math.max(-1, ...paths.map(p => p.z ?? -1), ...texts.map(t => t.z ?? -1)) + 1;
// Every item, back to front.
function layerItems() {
  return [...paths.map((ref, i) => ({ k: 'p', i, ref })), ...texts.map((ref, i) => ({ k: 't', i, ref }))]
    .sort((a, b) => a.ref.z - b.ref.z);
}
const isSelected = it => it.k === 'p' ? selectedPaths().includes(it.i) : it.i === selT;
function arrange(mode) {
  commitText();
  const list = layerItems(), on = list.map(isSelected);
  if (!on.some(Boolean)) return;
  snap();
  let out;
  if (mode === 'front') out = [...list.filter((_, j) => !on[j]), ...list.filter((_, j) => on[j])];
  else if (mode === 'back') out = [...list.filter((_, j) => on[j]), ...list.filter((_, j) => !on[j])];
  else {
    // Step each selected item past its neighbor, keeping selected groups together.
    out = list.slice(); const s = on.slice();
    const swap = j => { [out[j], out[j + 1]] = [out[j + 1], out[j]]; [s[j], s[j + 1]] = [s[j + 1], s[j]]; };
    if (mode === 'up') { for (let j = out.length - 2; j >= 0; j--) if (s[j] && !s[j + 1]) swap(j); }
    else { for (let j = 1; j < out.length; j++) if (s[j] && !s[j - 1]) swap(j - 1); }
  }
  out.forEach((it, j) => { it.ref.z = j; });
  render(); save();
}
const newFill = () => style.fillOn ? style.fill : null;
// Show the selected path's fill in the toolbar, or the default for new paths when nothing is selected.
function syncFill() {
  const t = editT || (selT >= 0 && texts[selT]);
  if (document.activeElement !== $('tsize')) $('tsize').value = t ? t.size : style.textSize;
  const fn = t ? (t.font || 'Figtree') : style.font;
  ensureFontOption(fn); $('tfont').value = fn;
  if (t) { $('fill-on').checked = true; $('fill').value = t.color; return; }
  const list = selectedPaths(), p = list.length ? paths[list[0]] : null;
  const on = p ? !!p.fill : style.fillOn;
  $('fill-on').checked = on;
  $('fill').value = (p && p.fill) || style.fill;
}

/* ---------- geometry ---------- */
function seg(a, b) {
  if (!a.ho && !b.hi) return `L${f(b.x)} ${f(b.y)}`;
  const c1 = a.ho || a, c2 = b.hi || b;
  return `C${f(c1.x)} ${f(c1.y)} ${f(c2.x)} ${f(c2.y)} ${f(b.x)} ${f(b.y)}`;
}
function pathD(p) {
  const n = p.nodes; if (!n.length) return '';
  let d = `M${f(n[0].x)} ${f(n[0].y)}`;
  for (let i = 1; i < n.length; i++) d += seg(n[i - 1], n[i]);
  if (p.closed && n.length > 1) d += seg(n[n.length - 1], n[0]) + 'Z';
  return d;
}

/* ---------- point insertion ---------- */
function lerp(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
function bez(a, b, t) {
  const p1 = a.ho || a, p2 = b.hi || b, u = 1 - t;
  return {
    x: u*u*u*a.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*b.x,
    y: u*u*u*a.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*b.y
  };
}
function nearestOnPaths(pt, maxD) {
  let best = null;
  paths.forEach((p, pi) => {
    if (p.hidden) return;
    const n = p.nodes, segs = p.closed ? n.length : n.length - 1;
    for (let i = 0; i < segs; i++) {
      const a = n[i], b = n[(i + 1) % n.length];
      let bt = 0, bd = Infinity;
      for (let s = 0; s <= 48; s++) { const t = s / 48, d = dist(pt, bez(a, b, t)); if (d < bd) { bd = d; bt = t; } }
      let step = 1 / 48;
      for (let r = 0; r < 12; r++) {
        step /= 2;
        for (const t of [bt - step, bt + step]) {
          if (t < 0 || t > 1) continue;
          const d = dist(pt, bez(a, b, t)); if (d < bd) { bd = d; bt = t; }
        }
      }
      if (bd < maxD && (!best || bd < best.d)) best = { p: pi, i, t: bt, d: bd };
    }
  });
  return best;
}
// Split the segment with de Casteljau so the curve keeps its exact shape.
function insertPoint(h) {
  const n = paths[h.p].nodes, a = n[h.i], b = n[(h.i + 1) % n.length], t = h.t;
  let node;
  if (!a.ho && !b.hi) {
    const q = lerp(a, b, t); node = { x: q.x, y: q.y, hi: null, ho: null };
  } else {
    const p1 = a.ho || a, p2 = b.hi || b;
    const p01 = lerp(a, p1, t), p12 = lerp(p1, p2, t), p23 = lerp(p2, b, t);
    const p012 = lerp(p01, p12, t), p123 = lerp(p12, p23, t), m = lerp(p012, p123, t);
    if (a.ho) a.ho = p01;
    if (b.hi) b.hi = p23;
    node = { x: m.x, y: m.y, hi: p012, ho: p123 };
  }
  n.splice(h.i + 1, 0, node);
  return h.i + 1;
}
function openEndAt(pt, hr) {
  for (let pi = paths.length - 1; pi >= 0; pi--) {
    const p = paths[pi], n = p.nodes;
    if (p.closed || p.hidden || !n.length) continue;
    if (dist(pt, n[n.length - 1]) < hr) return { p: pi, end: 'last' };
    if (dist(pt, n[0]) < hr) return { p: pi, end: 'first' };
  }
  return null;
}
function selectedPaths() {
  if (sel.p < 0 || !paths[sel.p]) return [];
  return [...new Set([sel.p, ...extra])].filter(i => paths[i]);
}
function boundsOf(list) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = q => { if (q.x < x0) x0 = q.x; if (q.x > x1) x1 = q.x; if (q.y < y0) y0 = q.y; if (q.y > y1) y1 = q.y; };
  list.forEach(pi => {
    const n = paths[pi].nodes, segs = paths[pi].closed ? n.length : n.length - 1;
    n.forEach(add);
    for (let i = 0; i < segs; i++) for (let s = 1; s < 16; s++) add(bez(n[i], n[(i + 1) % n.length], s / 16));

  return '#' + [r, g, b].map(n => Math.round(n).toString(16).padStart(2, '0')).join('');
}
async function importSVG(file) {
  if (!file) return;
  commitText(); finishPath();
  const parsed = new DOMParser().parseFromString(await file.text(), 'image/svg+xml');
  const root = parsed.documentElement;
  if (parsed.querySelector('parsererror') || root.localName !== 'svg') { alert('That file couldn’t be read as an SVG.'); return; }
  // Drop anything that could run code or load other files before it touches the page.
  root.querySelectorAll('script, foreignObject, image, use, iframe, video, audio').forEach(n => n.remove());
  [root, ...root.querySelectorAll('*')].forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name)) n.removeAttribute(a.name); }));

  // then let the browser resolve CSS, units and transforms for us.
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-100000px;top:0;width:0;height:0;overflow:hidden;pointer-events:none';
  document.body.appendChild(host);

  shadow.appendChild(s);

    const vb = s.viewBox && s.viewBox.baseVal;

    if (vb && vb.width > 0 && vb.height > 0) { w = vb.width; h = vb.height; ox = vb.x; oy = vb.y; }
    else {
      w = parseFloat(s.getAttribute('width')); h = parseFloat(s.getAttribute('height'));
      if (!(w > 0 && h > 0)) { const b = s.getBBox(); w = b.x + b.width; h = b.y + b.height; }
    }
    s.setAttribute('width', w); s.setAttribute('height', h);
    const toRoot = new DOMMatrix().translate(-ox, -oy).multiply(s.getScreenCTM().inverse());
    const skip = 'defs, clipPath, mask, symbol, pattern, marker, linearGradient, radialGradient, filter';
    const shown = el => { for (let n = el; n && n !== s.parentNode; n = n.parentElement) if (getComputedStyle(n).display === 'none') return false; return true; };
    const items = [];
    for (const el of s.querySelectorAll('path, rect, circle, ellipse, line, polyline, polygon, text')) {
      if (el.closest(skip) || !shown(el)) continue;
      const m = toRoot.multiply(el.getScreenCTM()), cs = getComputedStyle(el);
      const tp = q => q && { x: m.a * q.x + m.c * q.y + m.e, y: m.b * q.x + m.d * q.y + m.f };
      if (el.localName === 'text') {
        const str = el.textContent.replace(/\s+/g, ' ').trim(); if (!str) continue;
        const b = el.getBBox(), c = tp({ x: b.x + b.width / 2, y: b.y + b.height / 2 });
        const scale = Math.sqrt(Math.abs(m.a * m.d - m.b * m.c)) || 1;
        items.push({ t: { x: c.x, y: c.y, text: str, size: Math.round(parseFloat(cs.fontSize) * scale * 10) / 10 || 16,
          color: cssColorToHex(cs.fill, shadow) || '#000000', font: (cs.fontFamily.split(',')[0] || 'Figtree').replace(/["']/g, '').trim() } });
        continue;
      }
      let subs;
      try { subs = parsePathD(shapeToD(el)); } catch (err) { continue; }
      const fill = el.localName === 'line' ? null : cssColorToHex(cs.fill, shadow);
      for (const sp of subs) {
        if (sp.nodes.length < 2) continue;
        sp.nodes.forEach(n => {
          Object.assign(n, tp(n)); n.hi = tp(n.hi); n.ho = tp(n.ho);
          // Keep a sharp corner sharp when its handles are later dragged.
          if (n.hi && n.ho) {
            const ax = n.hi.x - n.x, ay = n.hi.y - n.y, bx = n.ho.x - n.x, by = n.ho.y - n.y, la = Math.hypot(ax, ay), lb = Math.hypot(bx, by);
            n.corner = !(la && lb && (ax * bx + ay * by) / (la * lb) < -0.999);
          }
        });
        items.push({ p: { nodes: sp.nodes, closed: sp.closed, fill, kind: el.localName === 'rect' ? 'rect' : (el.localName === 'circle' ? 'circle' : undefined) } });
      }
    }
    if (!items.length) { alert('No shapes or text were found in that SVG.'); return; }
    snap();
    const emptyBoard = !paths.length && !texts.length && !hasImage;
    if (emptyBoard) setDoc(Math.round(w), Math.round(h));
    let z = nextZ();
    const added = [];
    items.forEach(it => {
      if (it.p) { it.p.z = z++; paths.push(it.p); added.push(paths.length - 1); }
      else { it.t.z = z++; texts.push(it.t); }
    });
    setTool('edit');
    // Select the imported shapes so they can be moved or scaled right away.
    selT = -1; sel = { p: added.length ? added[0] : -1, n: -1 }; extra = added.slice(1);
    if (emptyBoard) fit(); else render();
    save();
  } catch (err) {
    alert('Something went wrong importing that SVG: ' + err.message);
  } finally {
    host.remove();
  }
}

/* ---------- controls ---------- */
$('t-pen').onclick = () => setTool('pen');
$('t-edit').onclick = () => setTool('edit');
$('t-pan').onclick = () => setTool('pan');
$('t-circle').onclick = () => setTool('circle');
$('t-rect').onclick = () => setTool('rect');
$('t-text').onclick = () => setTool('text');
$('flip-h').onclick = () => flipAll('h');
$('flip-v').onclick = () => flipAll('v');
$('clear-sketch').onclick = () => {
  img.removeAttribute('href');
  hasImage = false;
  flip = { h: false, v: false }; applyFlip();
  $('clear-sketch').disabled = true;
  render();
};
// Mirror the sketch and every path together so they stay aligned.
function flipAll(axis) {
  finishPath();
  snap();
  const m = axis === 'h' ? (q => { q.x = doc.w - q.x; }) : (q => { q.y = doc.h - q.y; });
  paths.forEach(p => p.nodes.forEach(n => { m(n); if (n.hi) m(n.hi); if (n.ho) m(n.ho); }));
  texts.forEach(m); // text stays readable; only its position mirrors
  flip[axis] = !flip[axis];
  applyFlip(); render(); save();
}
$('opacity').oninput = e => img.setAttribute('opacity', e.target.value);
$('color').oninput = e => { style.color = e.target.value; render(); save(); };
$('width').oninput = e => { const v = parseFloat(e.target.value); if (v >= 0) { style.width = v; render(); save(); } };
// Fill controls set the default for new paths and recolor any selected paths.
// Dragging around the color picker counts as one undo step.
let fillUndoOpen = false;
function applyFill(on, color) {
  if (editT) { editT.color = color; style.fill = color; placeEditor(); save(); return; }
  if (selT >= 0 && texts[selT]) {
    // Text always has a color, so the checkbox doesn't apply to it.
    if (!fillUndoOpen) { snap(); fillUndoOpen = true; }
    texts[selT].color = color; style.fill = color; render(); save(); return;
  }
  style.fillOn = on; style.fill = color;
  const list = selectedPaths();
  if (list.length) {
    if (!fillUndoOpen) { snap(); fillUndoOpen = true; }
    list.forEach(i => { paths[i].fill = on ? color : null; });
  }
  render(); save();
}
$('fill-on').onchange = e => { fillUndoOpen = false; applyFill(e.target.checked, $('fill').value); fillUndoOpen = false; };
$('fill').oninput = e => applyFill(true, e.target.value);
$('fill').onchange = () => { fillUndoOpen = false; };
let sizeUndoOpen = false;
$('tsize').oninput = e => {
  const v = parseFloat(e.target.value); if (!(v > 0)) return;
  style.textSize = v;
  if (editT) { editT.size = v; placeEditor(); }
  else if (selT >= 0 && texts[selT]) {
    if (!sizeUndoOpen) { snap(); sizeUndoOpen = true; }
    texts[selT].size = v; render();
  }
  save();
};
$('tsize').onchange = () => { sizeUndoOpen = false; };
$('tfont').onchange = e => {
  const v = e.target.value;
  if (v === '__more') { syncFill(); loadAllFonts(); return; }
  style.font = v;
  if (editT) { editT.font = v; placeEditor(); }
  else if (selT >= 0 && texts[selT]) { snap(); texts[selT].font = v; render(); }
  save();
};
$('docw').onchange = resizeCanvas;
$('doch').onchange = resizeCanvas;
$('zoomin').onclick = () => zoomCenter(1.25);
$('zoomout').onclick = () => zoomCenter(0.8);
$('fit').onclick = fit;
$('undo').onclick = undo;
$('redo').onclick = redo;
$('del').onclick = deleteSelected;
$('clear').onclick = () => {
  commitText(true);
  if (!paths.length && !texts.length) return;
  snap(); paths = []; texts = []; selT = -1; extra = []; cur = null; sel = { p: -1, n: -1 }; render(); save();
};

// Everything goes in one group in stacking order. Hidden items are left out.
function buildSVG() {
  const body = layerItems().filter(it => !it.ref.hidden).map(({ k, ref }) => {
    if (k === 'p') return ref.nodes.length > 1 ? `    <path${ref.fill ? ` fill="${ref.fill}"` : ''} d="${pathD(ref)}"/>` : '';
    return `    <text x="${f(ref.x)}" y="${f(ref.y)}" stroke="none" font-family="${esc(fontStack(ref.font))}" font-size="${ref.size}" fill="${ref.color}" text-anchor="middle" dominant-baseline="central">${esc(ref.text)}</text>`;
  }).filter(Boolean).join('\n');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${doc.w}" height="${doc.h}" viewBox="0 0 ${doc.w} ${doc.h}">\n` +
    `  <g fill="none" stroke="${style.color}" stroke-width="${style.width}" stroke-linecap="round" stroke-linejoin="round">\n` +
    body + `\n  </g>\n</svg>\n`;
}

/* ---------- layers panel ---------- */
const EYE = '<svg viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 16 16"><path d="M2 2l12 12M6.6 3.7A6.7 6.7 0 0 1 8 3.5C12.1 3.5 14.5 8 14.5 8a11 11 0 0 1-1.9 2.5M10 12.1a6 6 0 0 1-2 .4C3.9 12.5 1.5 8 1.5 8a11 11 0 0 1 2.6-3"/></svg>';
function layerName(it) {
  if (it.k === 't') return `“${it.ref.text}”`;
  const p = it.ref, base = p.kind === 'circle' ? 'Circle' : p.kind === 'rect' ? 'Rectangle' : p.closed ? 'Shape' : 'Path';
  return `${base} ${it.i + 1}`;
}
let layersHtml = '';
function renderLayers() {
  if ($('layers').hidden) return;
  const rows = layerItems().reverse().map(it => {
    const r = it.ref, cls = 'layer' + (isSelected(it) ? ' on' : '') + (r.hidden ? ' off' : '');
    const sw = it.k === 't'
      ? `<span class="sw" style="color:${r.color};font-family:${esc(fontStack(r.font))}">T</span>`
      : `<span class="sw" style="background:${r.fill || 'transparent'};border:2px solid ${style.color}"></span>`;
    return `<li class="${cls}" draggable="true" data-k="${it.k}" data-i="${it.i}">` +
      `<button class="eye" data-eye aria-label="${r.hidden ? 'Show' : 'Hide'} ${esc(layerName(it))}" title="${r.hidden ? 'Show' : 'Hide'}">${r.hidden ? EYE_OFF : EYE}</button>` +
      `${sw}<span class="lname">${esc(layerName(it))}</span></li>`;
  }).join('');
  const html = rows || '<li class="layers-none">Nothing here yet. Shapes and text you add will be listed, front to back.</li>';
  if (html !== layersHtml) { $('layer-list').innerHTML = html; layersHtml = html; }
}
function toggleLayers(open = $('layers').hidden) {
  $('layers').hidden = !open;
  $('layers-btn').setAttribute('aria-pressed', String(open));
  style.layersOpen = open; layersHtml = ''; render(); save();
}
const rowItem = li => ({ k: li.dataset.k, i: +li.dataset.i });
const refOf = ({ k, i }) => k === 'p' ? paths[i] : texts[i];
function selectLayer(it, add) {
  if (tool !== 'edit' && tool !== 'pan') setTool('edit'); else { commitText(); finishPath(); }
  if (it.k === 't') { selT = it.i; sel = { p: -1, n: -1 }; extra = []; }
  else {
    selT = -1;
    if (add && sel.p >= 0) {
      const set = selectedPaths();
      if (set.includes(it.i)) { const rest = set.filter(j => j !== it.i); sel = { p: rest.length ? rest[0] : -1, n: -1 }; extra = rest.slice(1); }
      else { sel.n = -1; extra.push(it.i); }
    } else { sel = { p: it.i, n: -1 }; extra = []; }
  }
  render();
}
const layerList = $('layer-list'), list = layerList;
list.addEventListener('click', e => {
  const li = e.target.closest('.layer'); if (!li) return;
  const it = rowItem(li), ref = refOf(it); if (!ref) return;
  if (e.target.closest('[data-eye]')) {
    commitText(); snap();
    ref.hidden = !ref.hidden;
    if (ref.hidden) { if (it.k === 't' && selT === it.i) selT = -1; if (it.k === 'p' && selectedPaths().includes(it.i)) { sel = { p: -1, n: -1 }; extra = []; } }
    render(); save(); return;
  }
  selectLayer(it, e.shiftKey);
});
// Drag rows to restack. Dropping on the top half of a row puts the item above it (in front).
let dragRow = null;
const clearDrop = () => list.querySelectorAll('.drop-above,.drop-below').forEach(n => n.classList.remove('drop-above', 'drop-below'));
list.addEventListener('dragstart', e => {
  const li = e.target.closest('.layer'); if (!li) return;
  dragRow = rowItem(li); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', '');
});
list.addEventListener('dragover', e => {
  const li = e.target.closest('.layer'); if (!li || !dragRow) return;
  e.preventDefault(); clearDrop();
  const r = li.getBoundingClientRect();
  li.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-above' : 'drop-below');
});
list.addEventListener('dragleave', e => { if (!list.contains(e.relatedTarget)) clearDrop(); });
list.addEventListener('dragend', () => { dragRow = null; clearDrop(); });
list.addEventListener('drop', e => {
  e.preventDefault();
  const li = e.target.closest('.layer'); clearDrop();
  if (!li || !dragRow) return;
  const target = rowItem(li), src = dragRow; dragRow = null;
  if (target.k === src.k && target.i === src.i) return;
  const r = li.getBoundingClientRect(), above = e.clientY < r.top + r.height / 2;
  commitText(); snap();
  const top = layerItems().reverse(); // front first, like the panel
  const from = top.findIndex(x => x.k === src.k && x.i === src.i), moved = top.splice(from, 1)[0];
  let to = top.findIndex(x => x.k === target.k && x.i === target.i);
  if (!above) to++;
  top.splice(to, 0, moved);
  top.forEach((x, j) => { x.ref.z = top.length - 1 - j; });
  render(); save();
});
$('layers-btn').onclick = () => toggleLayers();
$('z-front').onclick = () => arrange('front');
$('z-up').onclick = () => arrange('up');
$('z-down').onclick = () => arrange('down');
$('z-back').onclick = () => arrange('back');
$('export').onclick = () => { commitText(); finishPath(); $('out').value = buildSVG(); $('copy').textContent = 'Copy SVG'; $('dlg').showModal(); };
$('close').onclick = () => $('dlg').close();
$('download').onclick = () => {
  const url = URL.createObjectURL(new Blob([$('out').value], { type: 'image/svg+xml' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'tracing.svg';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
$('copy').onclick = async () => {
  const ta = $('out');
  try { await navigator.clipboard.writeText(ta.value); }
  catch (err) { ta.focus(); ta.select(); try { document.execCommand('copy'); } catch (e2) {} }
  $('copy').textContent = 'Copied';
};

window.addEventListener('resize', () => { applyView(); });

/* ---------- start ---------- */
load();
setDoc(doc.w, doc.h);
setTool('pen');
if (style.layersOpen) toggleLayers(true);
fit();
})();
</script>
